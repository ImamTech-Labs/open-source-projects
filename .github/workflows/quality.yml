name: Site quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: |
          node --check search-utils.js
          node --check app.js

      - name: Run search and filtering tests
        run: node --test scripts/search.test.js

      - name: Validate project profiles and page assets
        run: python scripts/check_site.py
