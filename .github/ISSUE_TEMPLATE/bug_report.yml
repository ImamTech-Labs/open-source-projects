name: Bug report
description: Report a problem so the maintainers can reproduce and fix it.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Before submitting, search existing issues to avoid duplicates.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem in a few sentences.
      placeholder: Tell us what you observed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps maintainers can follow.
      placeholder: |
        1. Go to...
        2. Select...
        3. See the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment or screenshots
      description: Add browser, operating system, error messages, or screenshots if relevant.
    validations:
      required: false
