name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Before submitting, search existing issues to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain who would benefit and why.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe your idea. It is fine if you are not sure about implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways to solve the problem?
    validations:
      required: false
